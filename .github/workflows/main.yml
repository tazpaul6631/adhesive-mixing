name: adhesive-mixing

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0

      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android APK
        run: npm run build:android

      - name: Sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/sign-android-apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adhesive-mixing-android
          path: android/app/build/outputs/apk/release/adhesive-mixing-release.apk
          retention-days: 7

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build iOS (Simulator)
        run: npm run build:ios

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: adhesive-mixing-ios-simulator
          path: ios/App/build/DerivedData/Build/Products/Release-iphonesimulator/App.app
          retention-days: 7

      - name: Archive iOS (optional, requires Apple signing secrets)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE_P12:-}" ]; then
            echo "Skipping iOS archive — set APPLE_CERTIFICATE_P12 secret to enable."
            exit 0
          fi

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          npm run build:ios:archive

      - name: Upload iOS Archive (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhesive-mixing-ios-archive
          path: ios/App/build/App.xcarchive
          retention-days: 7
          if-no-files-found: ignore
