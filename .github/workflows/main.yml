name: adhesive-mixing

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0

      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vue.js)
        run: npm run build

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Build Android APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # CI-only keystore (mỗi lần build tạo mới). Production: dùng secrets + keystore cố định.
      - name: Generate keystore and sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android/app/build/outputs/apk/release
          STORE_PASS="${KEYSTORE_PASS:-12345678}"
          KEY_PASS_VAL="${KEY_PASS:-12345678}"

          keytool -genkey -v -keystore adhesive-mixing-ci.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias adhesive_mixing -storepass "$STORE_PASS" -keypass "$KEY_PASS_VAL" \
            -dname "CN=JiaHsin, OU=IT, O=JiaHsin, L=HCM, ST=HCM, C=VN"

          zipalign -v -p 4 app-release-unsigned.apk app-release-aligned.apk

          apksigner sign \
            --ks adhesive-mixing-ci.jks \
            --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias adhesive_mixing \
            --key-pass "pass:$KEY_PASS_VAL" \
            --out adhesive-mixing-release.apk \
            app-release-aligned.apk

          apksigner verify --verbose adhesive-mixing-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adhesive-mixing
          path: android/app/build/outputs/apk/release/adhesive-mixing-release.apk
          retention-days: 7
